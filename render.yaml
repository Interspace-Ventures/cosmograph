# Cosmograph on Render (Blueprint spec: https://render.com/docs/blueprint-spec).
#
# One always-on web service runs the Express API and serves the built galaxy
# SPA from the same origin. Presence (WebSocket) and the in-memory spend guards
# need a long-lived single process: never scale-to-zero, never more than one
# instance until those move to Convex / the Exo router.
#
# Two services: cosmograph-staging (branch staging) and cosmograph-production
# (branch main, cosmograph.space). The cutover runbook is docs/prod-cutover.md.
#
# Node: Render reads .node-version (24.22.1), the single source of truth shared
# with CI, so NODE_VERSION is deliberately not set here. pnpm: Render provides
# pnpm for repos with pnpm-lock.yaml, and pnpm switches itself to the
# packageManager version (pnpm@11.9.0) from package.json.
#
# Secrets: none in platform env. The only secret this app gets on the host is
# one read-only Bitwarden Secrets Manager machine-account access token,
# BWS_ACCESS_TOKEN (sync: false, set by hand in the dashboard), for a machine
# account that can read only that service's Cosmograph project. The server
# reads the EXO intake secret from that project by key name at boot
# (artifacts/api-server/src/lib/runtimeSecrets.ts). Ask Cosmo does not run
# here: it is a Convex HTTP action on the Convex AI Gateway (convex/http.ts),
# so there is no model key on Render, and its caps (ASK_*) are Convex env.
# On staging the same token also feeds the Convex pre-deploy; see
# preDeployCommand below. Everything else below is public, non-secret
# configuration.
services:
  - type: web
    name: cosmograph-staging
    runtime: node
    plan: starter
    region: virginia
    branch: staging
    autoDeploy: true
    numInstances: 1
    buildCommand: pnpm install --frozen-lockfile && pnpm run deploy:build
    # Every staging deploy pushes the Convex functions to shiny-magpie-750 first,
    # with the deploy key read from Bitwarden Secrets Manager (project
    # "Cosmograph Staging"). Nobody runs `npx convex deploy` by hand
    # (docs/runbooks/no-owner-terminal.md). A failed push fails the deploy and
    # the previous one keeps serving. Kill switch: COSMOGRAPH_CONVEX_PREDEPLOY=off.
    preDeployCommand: node scripts/convex/deploy-from-bitwarden.mjs --pre-deploy
    startCommand: pnpm run deploy:start
    healthCheckPath: /cosmograph/api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Which deployment this is (health endpoint). Not the release audience.
      - key: DEPLOY_ENVIRONMENT
        value: staging
      # Release audience for feature flags: internal | friends-and-family | public.
      # Staging reviews the friends-and-family cut (docs/staging.md).
      - key: RELEASE_CHANNEL
        value: friends-and-family
      - key: VITE_RELEASE_CHANNEL
        value: friends-and-family
      # Render edge = Cloudflare + Render load balancer: two hops, measured
      # against forged X-Forwarded-For (lib/trustProxy.ts).
      - key: TRUST_PROXY_HOPS
        value: "2"
      # Private review surface: only requests carrying the Exo gateway token.
      - key: STAGING_AUTH_REQUIRED
        value: "true"
      - key: EXO_KEY_ISSUER
        value: https://frugal-eel-930.convex.site/exo-id
      # Served under the Exo gateway prefix (staging.exo.now/cosmograph).
      # Read at build time by Vite and at runtime by the API.
      - key: APP_BASE_PATH
        value: /cosmograph
      - key: BASE_PATH
        value: /cosmograph
      - key: ALLOWED_ORIGINS
        value: https://staging.exo.now
      # Cosmograph staging Convex deployment and staging Exo Imprint issuer.
      - key: VITE_CONVEX_URL
        value: https://shiny-magpie-750.convex.cloud
      - key: VITE_EXO_ID_ISSUER
        value: https://frugal-eel-930.convex.site/exo-id
      - key: VITE_EXO_ID_CLIENT_ID
        value: cosmograph
      - key: CSP_MODE
        value: report-only
      - key: CSP_CONNECT_SRC
        value: https://shiny-magpie-750.convex.cloud wss://shiny-magpie-750.convex.cloud https://shiny-magpie-750.convex.site https://frugal-eel-930.convex.site
      # Feedback intake daily ceilings (lib/spendGuard.ts); equal to the code
      # defaults. Ask Cosmo's caps live on the Convex deployment.
      - key: FEEDBACK_DAILY_PER_CLIENT
        value: "10"
      - key: FEEDBACK_DAILY_GLOBAL
        value: "300"
      # Convex pre-deploy (scripts/convex/deploy-from-bitwarden.mjs). The token
      # is the only secret: a read-only Bitwarden machine account
      # (cosmograph-staging) that can see only the "Cosmograph Staging" project,
      # which holds CONVEX_DEPLOY_KEY (prod:shiny-magpie-750|...) and any
      # CONVEX_ENV_<NAME> values synced to Convex env. Set in the dashboard.
      - key: BWS_ACCESS_TOKEN
        sync: false
      - key: BWS_ORGANIZATION_ID
        value: 26d8cde4-6650-4416-b799-b4f90104b84c
      # Bitwarden project "Cosmograph Staging" (set in the dashboard once the
      # project exists; the id is not secret).
      - key: BWS_PROJECT_ID
        sync: false

  - type: web
    name: cosmograph-production
    runtime: node
    plan: starter
    region: virginia
    branch: main
    autoDeploy: true
    numInstances: 1
    buildCommand: pnpm install --frozen-lockfile && pnpm run deploy:build
    startCommand: pnpm run deploy:start
    # Production serves at the root of cosmograph.space (as on the old host).
    healthCheckPath: /api/health
    # Every production deploy pushes the Convex functions to marvelous-grouse-975
    # first (Samir approved, 2026-11-07), with CONVEX_DEPLOY_KEY read from the
    # Bitwarden project "Cosmograph Production" through its own read-only token.
    # The script refuses production unless both
    # COSMOGRAPH_DEPLOYMENT_ENVIRONMENT=production and
    # COSMOGRAPH_ALLOW_PROD_CONVEX_DEPLOY=1 are set. A failed push fails the
    # deploy and the previous one keeps serving.
    preDeployCommand: node scripts/convex/deploy-from-bitwarden.mjs --pre-deploy
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEPLOY_ENVIRONMENT
        value: production
      # Production is the public audience (lib/release-flags). Features with no
      # public date stay off until a separate, approved release change.
      - key: RELEASE_CHANNEL
        value: public
      - key: VITE_RELEASE_CHANNEL
        value: public
      # Same Render edge as staging (two hops). Re-measure after the custom
      # domain is live (docs/prod-cutover.md).
      - key: TRUST_PROXY_HOPS
        value: "2"
      # Public site: the staging gateway boundary is off.
      - key: STAGING_AUTH_REQUIRED
        value: "false"
      - key: EXO_KEY_ISSUER
        value: https://befitting-bullfrog-619.convex.site/exo-id
      # Root path, no Exo gateway prefix.
      - key: APP_BASE_PATH
        value: /
      - key: BASE_PATH
        value: /
      - key: ALLOWED_ORIGINS
        value: https://cosmograph.space,https://www.cosmograph.space
      # Cosmograph production Convex deployment and production Exo Imprint issuer.
      - key: VITE_CONVEX_URL
        value: https://marvelous-grouse-975.convex.cloud
      - key: VITE_EXO_ID_ISSUER
        value: https://befitting-bullfrog-619.convex.site/exo-id
      # Issued by EXO for production (2026-11-03): apex https://cosmograph.space, redirect <origin>/auth/callback.
      - key: VITE_EXO_ID_CLIENT_ID
        value: cosmograph
      - key: CSP_MODE
        value: report-only
      - key: CSP_CONNECT_SRC
        value: https://marvelous-grouse-975.convex.cloud wss://marvelous-grouse-975.convex.cloud https://marvelous-grouse-975.convex.site https://befitting-bullfrog-619.convex.site
      # Bitwarden Secrets Manager: the access token is the only secret. The
      # organization and project ids are not secret but are only known once
      # the project exists, so they are set in the dashboard too.
      - key: BWS_ACCESS_TOKEN
        sync: false
      - key: BWS_ORGANIZATION_ID
        sync: false
      - key: BWS_PROJECT_ID
        sync: false
      - key: BWS_EXO_INTAKE_SECRET_NAME
        value: COSMOGRAPH_PROD_EXO_INTAKE_SECRET
      # Convex pre-deploy guards (scripts/convex/deploy-from-bitwarden.mjs).
      - key: COSMOGRAPH_DEPLOYMENT_ENVIRONMENT
        value: production
      - key: COSMOGRAPH_ALLOW_PROD_CONVEX_DEPLOY
        value: "1"
      # Feedback intake daily ceilings (lib/spendGuard.ts); equal to the code
      # defaults. Ask Cosmo's caps live on the Convex deployment.
      - key: FEEDBACK_DAILY_PER_CLIENT
        value: "10"
      - key: FEEDBACK_DAILY_GLOBAL
        value: "300"
