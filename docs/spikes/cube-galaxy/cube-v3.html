<!doctype html>

<head>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#0e0c13;--panel:#1a1722;--ink:#f3f1f7;--dim:#a49eb5;--accent:#a388ee;--edge:#000}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden}
  canvas{display:block}
  #stage{position:fixed;inset:0}
  .mono{font-family:"Space Mono",monospace;text-transform:uppercase;letter-spacing:.12em}
  .panel{background:var(--panel);border:2px solid var(--edge);box-shadow:6px 6px 0 var(--edge)}
  #top{position:fixed;left:16px;right:16px;top:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
  #brand{padding:10px 14px;pointer-events:auto}
  #brand b{display:block;font-size:20px;font-weight:800}
  #brand span{font-size:10px;color:var(--dim)}
  #kpis{display:grid;grid-template-columns:repeat(3,minmax(90px,auto));pointer-events:auto}
  #kpis div{padding:8px 12px;border-right:2px solid var(--edge)}
  #kpis div:last-child{border-right:0;text-align:right}
  #kpis small{display:block;font-size:9px;color:var(--dim)}
  #kpis strong{font-size:18px;font-variant-numeric:tabular-nums}
  #systems{position:fixed;left:16px;bottom:16px;width:290px;max-height:52vh;overflow:auto;scrollbar-width:thin;scrollbar-color:#000 var(--panel)}
  #systems h3{margin:0;padding:10px 12px;font-size:10px;color:var(--dim);border-bottom:2px solid var(--edge);cursor:pointer}
  #systems button{all:unset;display:flex;justify-content:space-between;gap:8px;width:100%;padding:8px 18px 8px 12px;font-size:12px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.06)}
  #systems button:hover{background:rgba(163,136,238,.12)}
  #systems button.on{background:var(--accent);color:#000}
  #systems button i{font-style:normal;width:10px;height:10px;border:2px solid #000;flex:none;margin-top:3px}
  #systems button em{font-style:normal;font-family:"Space Mono",monospace;font-size:10px;opacity:.7}
  .tag{position:fixed;left:0;top:0;pointer-events:none;font:700 10px "Space Mono",monospace;text-transform:uppercase;letter-spacing:.1em;padding:3px 6px;background:var(--panel);border:2px solid #000;box-shadow:3px 3px 0 #000;white-space:nowrap;transition:opacity .2s}
  .tag.on{background:var(--accent);color:#000}
  #card{position:fixed;right:16px;bottom:16px;width:330px;padding:14px;display:none}
  #card .mono{font-size:9px;color:var(--accent)}
  #card h4{margin:6px 0 10px;font-size:15px;line-height:1.3}
  #card .row{display:grid;grid-template-columns:1fr 1fr 1fr;border:2px solid var(--edge)}
  #card .row div{padding:6px 8px;border-right:2px solid var(--edge)}
  #card .row div:last-child{border-right:0;text-align:right}
  #card .row small{display:block;font-size:9px;color:var(--dim)}
  #legend{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);font-size:10px;color:var(--dim);padding:6px 10px;display:flex;gap:14px;align-items:center;white-space:nowrap}
  #legend b{color:var(--ink);font-weight:700}
  #jump{position:fixed;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
  #jump.on{opacity:1}
  #jump .mono{font-size:13px;background:var(--panel);border:2px solid #000;box-shadow:6px 6px 0 #000;padding:8px 14px}
  #toggles{position:fixed;right:16px;top:96px;display:flex;flex-direction:column;gap:8px}
  #toggles button{all:unset;cursor:pointer;font-size:10px;font-family:"Space Mono",monospace;text-transform:uppercase;letter-spacing:.1em;padding:8px 10px;background:var(--panel);border:2px solid #000;box-shadow:4px 4px 0 #000}
  #toggles button:active{transform:translate(4px,4px);box-shadow:none}
  @media (max-width:720px){#systems{width:auto;right:16px;max-height:44px;overflow:hidden}#systems.open{max-height:46vh;overflow:auto}#kpis,#legend{display:none}#toggles{top:auto;bottom:76px}#card{left:16px;width:auto;bottom:76px}}

  #hdr{position:fixed;left:0;right:0;top:0;display:flex;align-items:stretch;justify-content:space-between;border-bottom:2px solid #000;background:rgba(18,16,24,.82);backdrop-filter:blur(14px);z-index:20}
  #hdr .l{display:flex;align-items:center;gap:12px;padding:10px 16px}
  #hdr .l b{font-size:22px;font-weight:800;letter-spacing:-.02em}
  #hdr .l .ver{font-size:9px;color:var(--dim);border:2px solid #000;padding:2px 6px;background:var(--panel)}
  #hdr .r{display:flex}
  #hdr .r button{all:unset;cursor:pointer;font-size:10px;padding:0 16px;border-left:2px solid #000;display:flex;align-items:center;gap:6px}
  #hdr .r button:hover{background:rgba(163,136,238,.14)}
  #promo{position:fixed;left:50%;top:62px;transform:translateX(-50%);z-index:19;font-size:10px;padding:7px 12px;display:flex;gap:10px;align-items:center;white-space:nowrap}
  #promo button{all:unset;cursor:pointer;background:var(--accent);color:#000;padding:3px 8px;border:2px solid #000}
  #hero{position:fixed;left:0;right:0;top:108px;text-align:center;pointer-events:none;z-index:5}
  #hero .eyebrow{font-size:10px;color:var(--accent)}
  #stats{display:inline-grid;grid-template-columns:repeat(6,auto);margin-top:10px;pointer-events:auto}
  #stats div{padding:8px 14px;border-right:2px solid #000;text-align:left}
  #stats div:last-child{border-right:0}
  #stats strong{display:block;font-size:20px;font-variant-numeric:tabular-nums}
  #stats small{font-size:9px;color:var(--dim)}
  #stats .live strong{color:var(--accent)}
  #dock{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;z-index:20}
  #dock button{all:unset;position:relative;cursor:pointer;font-size:10px;padding:12px 14px;border-right:2px solid #000;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:62px}
  #dock button:last-child{border-right:0}
  #dock button .ico{font-size:15px;line-height:1}
  #dock button:hover:not(.soon){background:rgba(163,136,238,.14)}
  #dock button.on{background:var(--accent);color:#000}
  #dock button.primary{background:var(--ink);color:#000}
  #dock button.soon{color:#6c6680;cursor:help}
  #dock button.soon::after{content:"SOON";position:absolute;top:4px;right:4px;font-size:6px;letter-spacing:.1em;background:#000;color:var(--accent);border:1px solid var(--accent);padding:1px 4px}
  #foot{position:fixed;left:320px;right:200px;bottom:100px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;font-size:9px;color:#6c6680;pointer-events:none;z-index:4}
  .drawer{position:fixed;top:62px;bottom:84px;right:16px;width:420px;overflow:auto;z-index:21;display:none;padding:0;scrollbar-width:thin;scrollbar-color:#000 var(--panel)}
  .drawer.open{display:block}
  .drawer .tabs{display:flex;border-bottom:2px solid #000;position:sticky;top:0;background:var(--panel)}
  .drawer .tabs button{all:unset;cursor:pointer;flex:1;text-align:center;font-size:10px;padding:10px;border-right:2px solid #000}
  .drawer .tabs button:last-child{border-right:0}
  .drawer .tabs button.on{background:var(--accent);color:#000}
  .drawer .x{all:unset;cursor:pointer;position:absolute;right:10px;top:8px;font-size:16px}
  .drawer section{padding:16px 18px;border-bottom:2px solid #000}
  .drawer h5{margin:0 0 8px;font-size:10px;color:var(--accent)}
  .drawer h6{margin:0 0 10px;font-size:17px;line-height:1.25}
  .drawer p,.drawer li{font-size:13px;line-height:1.55;color:#d9d4e6}
  .drawer ul{padding-left:18px;margin:6px 0}
  .drawer .kv{display:grid;grid-template-columns:1fr 1fr;border:2px solid #000;margin-top:8px}
  .drawer .kv div{padding:8px 10px;border-right:2px solid #000;border-bottom:2px solid #000;font-size:12px}
  .drawer .kv div:nth-child(2n){border-right:0}
  .drawer .kv b{display:block;font-size:9px;color:var(--dim);font-family:"Space Mono",monospace;letter-spacing:.1em;text-transform:uppercase}
  .rel{padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.07)}
  .rel .meta{font-size:9px;color:var(--dim)}
  .rel .meta i{font-style:normal;color:var(--accent)}
  .rel strong{display:block;font-size:13px;margin:4px 0}
  .plans{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
  .plan{border:2px solid #000;box-shadow:4px 4px 0 #000;padding:12px;background:#15121d}
  .plan.hi{background:var(--accent);color:#000}
  .plan.hi p,.plan.hi li{color:#000}
  .plan .price{font-size:26px;font-weight:800}
  .plan .price small{font-size:11px;font-weight:600}
  .cta{all:unset;cursor:pointer;display:block;text-align:center;margin-top:10px;padding:9px;border:2px solid #000;background:#000;color:var(--ink);font-size:10px}
  .plan.hi .cta{background:#000;color:var(--accent)}
  #toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:30;font-size:11px;padding:8px 12px;display:none}
  #brand,#kpis,#legend{display:none!important}
  #toggles{top:auto;bottom:20px}
  #systems{bottom:20px;max-height:calc(100vh - 380px);overflow-x:hidden}
  #systems button{box-sizing:border-box}
  #systems button em{padding-right:4px}
  #card{bottom:76px}
  @media (max-width:720px){#hdr .r button span{display:none}#promo{display:none}#stats{grid-template-columns:repeat(3,auto)}#stats div:nth-child(n+4){display:none}#dock button{min-width:0;padding:10px 8px}#dock button .lbl{font-size:8px}.drawer{left:8px;right:8px;width:auto}#foot{display:none}#hero{top:72px}#systems{bottom:84px}}
  @media (max-width:720px){
    #systems{left:8px;right:auto;width:200px;bottom:84px;max-height:38px;overflow:hidden}
    #systems.open{max-height:46vh;overflow:auto}
    #dock{left:8px;right:8px;transform:none;justify-content:space-between}
    #dock button{flex:1;min-width:0;padding:9px 2px;gap:3px}
    #dock button .lbl{font-size:7px;letter-spacing:.04em;white-space:nowrap}
    #dock button.soon::after{top:2px;right:2px;font-size:5px;padding:0 2px}
    #eyebrow{font-size:8px;padding:0 12px}
    #toggles{bottom:84px}
  }
</style>

<body>
<div id="stage"></div>
<div id="top" style="display:none"><div id="brand"></div><div id="kpis"></div></div>
<header id="hdr">
  <div class="l"><b>cosmograph</b><span class="ver mono" id="ver"></span></div>
  <div class="r mono">
    <button id="hShare">↗ <span>Share</span></button>
    <button id="hSponsor">♥ <span>Sponsor</span></button>
    <button id="hSource">⌘ <span>Source</span></button>
  </div>
</header>
<div id="promo" class="panel mono">Launching soon · $9.99 / year or $29.99 lifetime <button id="promoBtn">See what's included</button></div>
<div id="hero">
  <div class="eyebrow mono" id="eyebrow"></div>
  <div id="stats" class="panel mono"></div>
</div>
<nav id="dock" class="panel mono">
  <button class="primary" data-act="signup"><span class="ico">✦</span><span class="lbl">Sign up</span></button>
  <button data-act="tour"><span class="ico">▶</span><span class="lbl">Tour</span></button>
  <button class="on" data-act="orbit"><span class="ico">◎</span><span class="lbl">Orbit</span></button>
  <button class="soon" data-act="fly" data-soon="Fly mode: pilot your own ship through the galaxy."><span class="ico">➤</span><span class="lbl">Fly</span></button>
  <button data-act="info"><span class="ico">i</span><span class="lbl">Info</span></button>
  <button class="soon" data-act="ask" data-soon="Ask Cosmo: ask about the work and watch matching papers light up."><span class="ico">✳</span><span class="lbl">Ask</span></button>
  <button class="soon" data-act="gift" data-soon="Make it a gift: their name, an envelope reveal, and a guided walk through their journey."><span class="ico">✉</span><span class="lbl">Gift</span></button>
</nav>
<div id="foot" class="mono"></div>
<div id="toast" class="panel mono"></div>
<aside id="info" class="drawer panel"><button class="x" data-close>×</button>
  <div class="tabs mono"><button class="on" data-tab="about">About</button><button data-tab="guide">Guide</button><button data-tab="log">Changelog</button></div>
  <div data-pane="about"></div><div data-pane="guide" hidden></div><div data-pane="log" hidden></div>
</aside>
<aside id="pricing" class="drawer panel"><button class="x" data-close>×</button><div id="pricingBody"></div></aside>
<div id="toggles">
  <button class="mono" id="tour" style="display:none">▶ Jump tour</button>
  <button class="mono" id="iso">◇ Iso view</button>
  <button class="mono" id="topv">⊙ Top view</button>
</div>
<div id="systems" class="panel"><h3 class="mono">Systems · tap to jump</h3><div id="list"></div></div>
<div id="card" class="panel"></div>
<div id="legend" class="mono panel"><span><b>Bigger cube</b> = more citations</span><span><b>Closer to sun</b> = more central to the field</span><span>Drag rotate · Right-drag pan · Scroll zoom</span></div>
<div id="tags"></div>
<div id="jump"><div class="mono" id="jumpLabel">Jumping</div></div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const DATA = {"author":"Mahendra S. Rao","stats":{"totalPapers":364,"totalCitations":28860,"uniqueCoAuthors":1191,"firstYear":1994,"lastYear":2024,"yearsActive":30,"domainCount":12,"estimatedWords":1442000,"avgCitations":79,"mostCited":{"title":"SOX2, a Persistent Marker for Multipotential Neural Stem Cells Derived from Embryonic Stem Cells, the Embryo or the Adult","citations":749,"year":2004}},"domains":[{"id":"sun-0","name":"Pluripotent Stem Cells","field":"Biochemistry, Genetics and Molecular Biology","papers":179,"cites":13761},{"id":"sun-1","name":"Developmental Neuroscience","field":"Neuroscience","papers":60,"cites":6593},{"id":"sun-2","name":"Molecular Biology","field":"Biochemistry, Genetics and Molecular Biology","papers":25,"cites":1958},{"id":"sun-3","name":"Cross-Disciplinary","field":"Other","papers":19,"cites":472},{"id":"sun-4","name":"Genetics","field":"Medicine","papers":18,"cites":2016},{"id":"sun-5","name":"Physiology","field":"Medicine","papers":16,"cites":619},{"id":"sun-6","name":"CRISPR and Genetic Engineering","field":"Biochemistry, Genetics and Molecular Biology","papers":13,"cites":683},{"id":"sun-7","name":"Cellular and Molecular Neuroscience","field":"Neuroscience","papers":12,"cites":625},{"id":"sun-8","name":"Neurology","field":"Medicine","papers":10,"cites":1068},{"id":"sun-9","name":"Cell Biology","field":"Biochemistry, Genetics and Molecular Biology","papers":4,"cites":715},{"id":"sun-10","name":"Surgery","field":"Medicine","papers":4,"cites":189},{"id":"sun-11","name":"Oncology","field":"Medicine","papers":4,"cites":161}],"changelog":[{"version":"3.38.0","codename":"Mission Clock","date":"2026-07-30","summary":"Cosmograph now reveals completed features on a deliberate weekly flight plan.","changes":["Added a friends-and-family release cadence so finished features can arrive in steady weekly waves, with browser and server safeguards plus emergency overrides.","Replaced the browser tab's generic red square with the canonical Cosmograph globe mark.","Standardized the private staging URL and added a server-enforced Clerk access boundary while keeping health checks public."]},{"version":"3.37.0","codename":"Opening Credits","date":"2026-07-05","summary":"Watch the launch trailer straight from the title screen.","changes":["Added a \"Watch the trailer\" button on the opening title screen, right below \"Ad Astra\" \u2014 a quick flight through the galaxy before you dive in yourself."]},{"version":"3.36.1","codename":"Steady Hand","date":"2026-07-05","summary":"The guided tour is calmer, clearer, and actually shows off Ask Cosmo.","changes":["The \"Two ways to travel\" stop now demonstrates both modes in one shot \u2014 starting in the overhead Orbit view, then dropping down into a first-person Fly glide so you can watch the switch happen.","Steadied the tour camera: instead of drifting in a full circle, it now gently sways to show depth while keeping each subject centered and in focus.","The \"Ask Cosmo\" stop now pulls up a live preview of the Ask panel \u2014 showing the question and Cosmo's answer \u2014 while the matching papers light up behind it.","Tidied the tour card: the page dots now sit below the text instead of crowding it."]},{"version":"3.36.0","codename":"Grand Tour","date":"2026-07-05","summary":"The guided tour now shows off flying, rotating angles, and Ask Cosmo.","changes":["The tour now dips into Fly mode \u2014 dropping into the plane for a first-person glide through the brightest field \u2014 so you can see both ways to travel, not just the planetarium Orbit view.","Each stop now slowly sweeps its camera angle, so the galaxy's real 3D depth reads instead of a flat straight-on shot.","New \"Ask Cosmo\" stop: a real plain-English question runs live and the matching papers light up while the rest fade \u2014 a taste of the query panel before you try it yourself."]},{"version":"3.35.0","codename":"Second Pass","date":"2026-07-04","summary":"Replay the opening flight any time, and the tour card clears the controls.","changes":["Added a \"Replay intro\" button in Info \u2192 About, so you can run the opening title sequence again \u2014 handy for showing someone the galaxy from the start.","The guided-tour card no longer tucks its bottom edge under the cockpit bar on desktop; it now floats cleanly above the controls."]},{"version":"3.34.0","codename":"Event Horizon","date":"2026-07-04","summary":"The galaxy stays smooth even for the most prolific scientists alive.","changes":["For an enormous body of work (think thousands of papers), the galaxy now renders the most-cited papers as planets and keeps the rest counted in every stat, domain, and answer \u2014 so the view stays buttery on any machine instead of drowning in planets.","Every realistic scientist is unchanged: if the corpus fits, every single paper still gets its own planet."]},{"version":"3.33.0","codename":"Station Keeping","date":"2026-07-03","summary":"The paper card slims down, and your ship now holds formation with a selected planet.","changes":["Co-authors in the paper card now fit on a single line \u2014 the rest collapse into a \"+N\" chip you can tap to see everyone.","The paper card no longer hides under the header on desktop.","Selecting a planet in Fly mode engages a tracking cam: the ship smoothly holds formation with the planet as it orbits, so you can read the card without chasing it.","Touch the controls (keys or mouse-look) and the ship hands the stick back to you without snapping the view; click the planet again to re-engage tracking."]},{"version":"3.32.0","codename":"Slipstream","date":"2026-07-02","summary":"A faster galaxy \u2014 the same view, drawn with a fraction of the work.","changes":["Merged every solar system's orbit rings into a single draw call each (they used to be one per paper \u2014 hundreds per frame).","Orbit rings no longer respond to the mouse, so moving the cursor doesn't hit-test hundreds of invisible lines anymore.","Planets, clouds, and moons use leaner sphere meshes \u2014 visually identical at galaxy scale, far fewer vertices per frame.","The galaxy now adapts its render resolution to your machine: if the frame rate dips, it quietly drops sharpness a notch and climbs back when things recover.","Asks dual-GPU laptops for the fast graphics card, and stopped paying for antialiasing twice."]},{"version":"3.31.0","codename":"Target Lock","date":"2026-07-02","summary":"Fly mode gets a real targeting HUD, search finds the right scientist, and you can hop back to the last galaxy.","changes":["Planets and suns are now clickable while flying \u2014 a pulsing corner-bracket reticle locks onto your target and tracks it through the canopy, with its name underneath.","Dragging to look around no longer counts as a click, so steering the ship won't select planets or drop your target lock.","Personalize search now matches on the scientist's name only \u2014 searching \"Albert Einstein\" no longer surfaces researchers who merely work at an institute named after him.","After exploring a new scientist, a \"Return to \u2026\" button in Personalize jumps you straight back to the previous galaxy \u2014 instantly, no re-download."]},{"version":"3.30.0","codename":"Sliding Hatch","date":"2026-07-02","summary":"Signing in stays in the galaxy, and the Tour sits with the other ways to fly.","changes":["Sign In / Sign Up now rise as a dismissible cockpit panel \u2014 like Info, Ask, and Personalize \u2014 instead of taking over the whole screen.","The auth form blends straight into the panel (no box-in-a-box), and the copy is on-theme: \"Become a cosmonaut\" / \"Welcome back, cosmonaut\".","Moved the Tour button next to the Orbit/Fly switch, grouping all the ways to explore the galaxy together."]},{"version":"3.29.0","codename":"Afterburner","date":"2026-07-01","summary":"Real rocket fire out the back \u2014 the engines now burn like a true spaceship.","changes":["Replaced the soft blue engine orb with a proper fiery exhaust: a white-hot core inside an orange plume.","The flame flickers like live combustion and stretches longer the harder you throttle.","Kept it tight so it feels like a spaceship without hogging the screen."]},{"version":"3.28.1","codename":"Welcome Back","date":"2026-06-30","summary":"The cockpit now remembers returning pilots and their usual login.","changes":["First-time visitors see Sign Up; if you've signed in before on this device, it greets you with Sign In instead.","If you last logged in with a service like Google or GitHub, the button now names it \u2014 one click back in."]},{"version":"3.28.0","codename":"Hangar Bay","date":"2026-06-30","summary":"Sign in to claim a profile and fly a ship that's truly yours.","changes":["Added Sign In / Sign Up in the cockpit, and a signed-in account panel showing your member status and ship.","New ship hangar: choose a hull type \u2014 the free Scout, or the premium Fighter, Hauler, and Interceptor \u2014 each with its own distinctive silhouette.","Members get three ship types included; anyone can unlock an extra type for a one-time $1. Colors stay free on any ship you own.","Other cosmonauts now see the exact ship type you're flying."]},{"version":"3.27.1","codename":"Tight Burn","date":"2026-06-30","summary":"Tuned the engine thrusters down to a tighter, more focused burn.","changes":["Made the rear thruster flare smaller and more concentrated so it reads like a real space engine nozzle instead of a soft halo."]},{"version":"3.27.0","codename":"True North","date":"2026-06-30","summary":"Fly controls now track the ship 1:1, and engines glow when you move.","changes":["Fixed Fly steering so the ship pitches and turns to match your controls \u2014 pressing up now tilts the nose up instead of rolling sideways.","Replaced the nose beacon with twin rear thrusters that glow brighter the faster you fly."]},{"version":"3.26.1","codename":"Clean Hull","date":"2026-06-30","summary":"Dropped the glowing aura around your ship in Fly mode.","changes":["Your ship in Fly mode no longer has a glowing aura around it \u2014 just the clean hull."]},{"version":"3.26.0","codename":"Snug Fit","date":"2026-06-30","summary":"The rich panels (Info, Ask Cosmo, Personalize) now match the width of the cockpit navbar exactly.","changes":["The Info, Ask Cosmo, and Personalize panels are now always exactly as wide as the cockpit bar below them."]},{"version":"3.25.1","codename":"Header Crew","date":"2026-06-30","summary":"The header buttons are now slimmer and reordered \u2014 Source, Sponsor, Share.","changes":["Source (the GitHub repo), Sponsor, and Share buttons in the header are now smaller and reordered."]},{"version":"3.25.0","codename":"Header Crew","date":"2026-06-30","summary":"The Sponsor, GitHub, and Share buttons moved up beside the Cosmograph title, leaving the cockpit for the controls you fly with.","changes":["Sponsor, GitHub, and Share now sit just to the right of the Cosmograph header instead of in the cockpit.","The cockpit dashboard is now focused purely on in-galaxy controls."]},{"version":"3.24.0","codename":"Chase the Stars","date":"2026-06-30","summary":"Fly mode is now a third-person chase \u2014 you can see and steer your own ship \u2014 the cockpit buttons gained labels, and the AI is now named Cosmo.","changes":["Fly mode switched from first-person to a third-person chase camera, so you can see your own ship as you weave through the galaxy (nicer ships ahead).","Your ship no longer appears in Orbit view \u2014 it's reserved for Fly.","Every cockpit button now shows its name beside the icon, so it's clear at a glance.","The cockpit now sits a little higher, lifted clear of the footer credits.","The \"Ask Cosmos\" assistant is now simply \"Cosmo\"."]},{"version":"3.23.0","codename":"Cockpit Dashboard","date":"2026-06-30","summary":"Every control now lives in one clean cockpit dashboard along the bottom of the screen, and the rich panels rise up from it \u2014 freeing the galaxy to fill the whole view.","changes":["The Mission Control side rail and the top-right Sponsor / GitHub / Share buttons are gone, replaced by a single bottom dashboard that holds every control.","Info, Ask Cosmos, and Personalize now rise as panels from the dashboard, centered above the bar on both desktop and mobile.","With the side rail gone, the galaxy now fills the entire screen.","Your account, ship save, and shuffle controls moved into the top of the Personalize panel."]},{"version":"3.22.0","codename":"Notification Deck","date":"2026-06-28","summary":"Tips and offers now arrive as one tidy notification banner that gently slides the view down instead of floating over the galaxy, and the Orbit/Fly switch moved to the bottom of the console.","changes":["Flight-control tips and the membership offer now share a single slim banner up top that eases the view down to make room \u2014 no more pop-ups floating over the stars.","When there's more than one thing to mention, the banner quietly cycles between them.","The Orbit / Fly view switch now lives at the bottom of the console, set apart from the other controls."]},{"version":"3.21.0","codename":"Signal Boost","date":"2026-06-28","summary":"Gentle, dismissable nudges: a slim top banner for the $7/year membership deal, and a one-time prompt to support the project once you've settled in.","changes":["A slim banner up top highlights the limited-time $7/year membership \u2014 dismiss it once and it stays gone.","The banner's \"See what's included\" opens the Personalize panel, which now lists every membership benefit.","After you've spent a little time exploring, a small unobtrusive card invites you to sponsor, star the repo, or spread the word \u2014 shown only once."]},{"version":"3.20.0","codename":"Clean Console","date":"2026-06-28","summary":"A tidier cockpit: fewer buttons, panels that open one at a time, and quick Share and GitHub controls pinned to the top-right corner.","changes":["The flight log moved inside the Info panel as a tab, so it's one less button on the console.","Orbit and Fly are now a single toggle instead of two separate buttons, and the old Re-Intro button is gone.","Detail panels now open one at a time at the same width \u2014 opening one closes the others so they never stack up.","Share and the GitHub link now sit as quick buttons in the top-right corner instead of being buried in the console.","On phones the bottom console now shows a short text label under each icon, so it's clear what every button does."]},{"version":"3.19.0","codename":"Thumb Reach","date":"2026-06-28","summary":"On phones the console now lives along the bottom of the screen, so the galaxy gets the full width and the controls sit right under your thumb.","changes":["On phones the Mission Control console moved from the right edge to the bottom of the screen \u2014 the galaxy now uses the full width.","Expanding the console on a phone slides a panel up from the bottom instead of in from the side.","Detail panels now span the full width above the bottom console so they're easier to read."]},{"version":"3.18.0","codename":"Pocket Cosmos","date":"2026-06-28","summary":"A big pass on the phone experience \u2014 clearer text, a console that stays out of the way, and detail panels that fit the screen.","changes":["Paper and domain text is now crisp and high-contrast instead of a soft glow that read as blurry on phones.","On phones the console now starts as a slim rail instead of the full panel, so it no longer covers the galaxy.","Detail panels no longer slide under the console and are sized to fit a phone screen.","Added a subtle backdrop behind the title and stats so they stay readable over bright stars."]},{"version":"3.17.0","codename":"Wayfinder","date":"2026-06-27","summary":"Sign in and you get your own invite link \u2014 bring fellow explorers into the galaxy and we'll keep count.","changes":["Every signed-in explorer now has a personal invite link, found in the Share panel \u2014 copy it and send it to anyone.","When someone signs up through your link for the first time, they're counted as your referral, permanently.","Not signed in? The Share panel now invites you to create a free account so you can get your own link too."]},{"version":"3.16.0","codename":"Hangar","date":"2026-06-26","summary":"Sign in to save your ship \u2014 your chosen craft now follows you across devices and every other cosmonaut sees it live.","changes":["Signed-in explorers can now save their ship: it's remembered on your account and follows you to every device.","Other cosmonauts now see your exact ship in real time, not a generic one \u2014 shuffle to a look you like, then Save.","New 'Your ship' panel in the account area with a live look preview, a Shuffle button, and a Save button.","The Show ship / Hide ship toggle moved onto the Orbit button itself, so ship controls live together."]},{"version":"3.15.0","codename":"Liveries","date":"2026-06-26","summary":"Every cosmonaut now flies a distinct ship, and your own chase craft turns near-invisible with a one-tap show/hide toggle.","changes":["Each cosmonaut's ship now has its own look \u2014 hull tint, engine glow, nose running-light, and size all vary per explorer \u2014 so the galaxy reads as a real crowd of distinct craft.","Your own ship in Orbit view is now barely-there glass, so it never blocks the galaxy or UI behind it.","New 'Show ship / Hide ship' toggle under Navigate lets you hide your own ship in Orbit view entirely; the choice is remembered next visit.","Your ship's look now stays the same across visits (saved in your browser), laying the groundwork for saving and customizing it once you sign in."]},{"version":"3.14.0","codename":"Dropship","date":"2026-06-26","summary":"Cosmonauts now fly a real low-poly spaceship \u2014 smaller and sharper \u2014 and signing in from an embedded preview is no longer a maze.","changes":["Every ship (yours and other cosmonauts') is now an actual low-poly spaceship model instead of a hand-built cone, and rides noticeably smaller in the galaxy.","Signing in from an embedded preview now offers a 'Continue in a new window' handoff, so the security check and Google/GitHub sign-in finish together in one place."]},{"version":"3.13.0","codename":"Squadron","date":"2026-06-26","summary":"Other explorers now appear as little ships flying the galaxy with you \u2014 and you pilot your own.","changes":["Fellow cosmonauts are now rendered as small low-poly ships that point the way they're flying, instead of faint glowing wisps.","New arrivals get a short grace period before others fade in, with a gentle 'More cosmonauts arriving' notice, so you can find your bearings first.","In orbit view your own ship now appears as a small glowing sprite among the galaxy \u2014 like the other cosmonauts \u2014 banking gently as you orbit."]},{"version":"3.12.0","codename":"Tilted Rings","date":"2026-06-25","summary":"Every planet now spins on its own tilted axis, and ringed worlds are no longer identical twins.","changes":["Each planet gets its own axial tilt, spin direction, speed, and starting angle, so same-type worlds no longer rotate in lockstep like clones.","Ringed planets now vary their ring width, tilt, roll, tint, and opacity, so no two ringed worlds look exactly alike."]},{"version":"3.11.0","codename":"Spectral Worlds","date":"2026-06-24","summary":"Planets now come in many more colours and kinds \u2014 molten, frozen, verdant, ocean, and exotic gas giants.","changes":["Greatly widened planet variety: alongside the real solar-system worlds, papers can now appear as molten lava worlds with glowing magma veins, frozen ice worlds, verdant Earth-likes, amber deserts, turquoise oceans, carbon rock worlds, and violet, rose, and emerald gas giants.","The galaxy reads with far richer colour instead of mostly red, off-white, and blue."]},{"version":"3.10.2","codename":"Open Hatch","date":"2026-06-24","summary":"The membership panel now explains why subscribing creates an account.","changes":["Added a short note next to Subscribe explaining that membership creates a free account so your unlocks stay tied to you across devices and billing stays self-serve.","Toned down the Sponsor and Personalize buttons in the console: instead of a full purple highlight, they now carry a subtle inline tag marking them as paid.","Simplified the galaxy loading screen \u2014 the cosmograph mark now fills up on its own, without a separate progress bar or percentage."]},{"version":"3.10.1","codename":"Steady Frame","date":"2026-06-23","summary":"The shareable screenshot now renders reliably and sits more compactly.","changes":["Fixed the shareable screenshot sometimes loading blank \u2014 the card now waits for the galaxy to actually render before capturing.","Trimmed the membership panel's height so it fits the screen more comfortably.","Each membership perk now has its own icon matching the feature, with an AI star for Ask Cosmos."]},{"version":"3.10.0","codename":"Bird's Eye","date":"2026-06-23","summary":"Shareable screenshots now capture the galaxy from a top-down view.","changes":["The shareable screenshot now shows your galaxy from a top-down vantage, framing the whole disk instead of the last camera angle."]},{"version":"3.9.0","codename":"Clear Skies","date":"2026-06-23","summary":"Console polish, clearer Subscribe + Sponsor actions, and steadier sharing.","changes":["Tightened the spacing under the Mission Control header so Platform sits up closer to the top.","Personalize now shows an Upgrade badge instead of a Premium one, with the helper line moved below the button.","The console's Sign In action is now a clear Subscribe button \u2014 subscribing signs you in along the way.","Renamed Donate to Sponsor, with a heart on the left and the GitHub mark on the right.","Shareable screenshots are more reliable \u2014 the card always renders, falling back to the branded stats card if the live view can't be captured.","The preview screenshot now lives inside the membership panel instead of behind it, with a single Copy-image-to-clipboard action.","Refreshed the membership panel \u2014 accent Subscribe button, clearer $7/year preview copy, and an updated feature list.","Clearer messaging when OpenAlex is rate-limiting researcher search."]},{"version":"3.8.0","codename":"Celestial Globe","date":"2026-06-23","summary":"A new logo \u2014 a celestial globe with an AI star at its core.","changes":["New brand mark: a lat/long graticule globe with a generated-star spark at the center, now in the header, the browser tab, and the sign-in screen."]},{"version":"3.7.0","codename":"Control Tower","date":"2026-06-23","summary":"Mission Control gets a cleaner layout \u2014 Platform sits up top.","changes":["Reorganized the console: a single Platform section now sits at the top with Info, Sign In, Changelog, Donate, Ask, and Personalize all in one place.","Renamed the old Customize section to Personalize \u2014 a highlighted premium action to choose a scientist for your own cosmograph."]},{"version":"3.6.0","codename":"Postcard","date":"2026-06-23","summary":"Custom galaxies open as a shareable postcard \u2014 membership drops to $7.","changes":["Searching a scientist now opens their cosmograph as a full-screen shareable screenshot with one tap to copy, download, or share it.","Membership is now $7/year \u2014 subscribe right from the screenshot to unlock the full interactive galaxy for anyone you search.","The home scientist stays free and fully interactive, no account needed."]},{"version":"3.5.0","codename":"Make It Yours","date":"2026-06-23","summary":"Customize gets its own premium tab in the console.","changes":["Pulled the scientist search out of the Info drawer into a dedicated Customize tab, flagged with a Premium badge so it's clear deep exploration of a custom scientist is a paid unlock.","Refreshed the Ask panel's starter prompts into clickable chips."]},{"version":"3.4.0","codename":"Mission Control","date":"2026-06-23","summary":"A new Platform bay in Mission Control.","changes":["Added a Platform section to Mission Control with Customize, Changelog, and Donate in one place.","Customize now has its own panel \u2014 search for any scientist and the galaxy rebuilds around their work (moved out of the Info drawer)."]},{"version":"3.3.0","codename":"Just Ask","date":"2026-06-23","summary":"One input, zero modes \u2014 Ask reads your intent.","changes":["Dropped the Ask/Bug/Feature toggle: just type. Asking about the work runs a search; saying something's broken or wished-for files it with the team automatically.","Tidied the console \u2014 Info and Sign in now sit right at the top, no Profile drawer to open."]},{"version":"3.2.0","codename":"One Console","date":"2026-06-23","summary":"Ask does it all \u2014 and feedback flies through the same chat.","changes":["Retired the separate Find box \u2014 Ask now handles jumping to papers and domains alongside questions.","Report a bug or request a feature right inside the Ask chat: switch modes, type, and it's filed straight to the team."]},{"version":"3.1.0","codename":"Orbital Pass","date":"2026-06-23","summary":"Membership goes yearly \u2014 and Ask Cosmos comes aboard.","changes":["Full access is now a $10/year membership: fly, tour, and deep-dive any scientist you search, with every new feature included.","Ask Cosmos headlines membership \u2014 ask questions about any researcher's work, answered from their galaxy.","Fellow explorers are now 'cosmonauts' \u2014 watch the live headcount streaming the stars with you.","Every voyage now ends with a personal welcome: \"Welcome to the [scientist] cosmos.\""]},{"version":"3.0.0","codename":"Cosmograph","date":"2026-06-22","summary":"A new name for the voyage \u2014 Galactic is now Cosmograph.","changes":["New identity: the app is now Cosmograph, charting any scientist's life in science at cosmograph.space.","The wordmark, share cards, footer, and live presence all fly the Cosmograph flag from bridge to bottom."]},{"version":"2.1.0","codename":"Voyager's Pass","date":"2026-06-22","summary":"Chart any sky for free; unlock the helm to fly it.","changes":["Accounts have landed: sign in to carry your unlock across every visit.","Every searched scientist opens as a free preview \u2014 full stats, summary, and a shareable card, no account needed.","A one-time $10 pass unlocks deep exploration \u2014 fly, guided tours, and rich paper detail \u2014 for any researcher you search, forever.","The home scientist stays wide open: no sign-in, no paywall, the whole galaxy free to roam.","Sponsor Cosmograph on GitHub right from the unlock panel to keep the lights on."]},{"version":"2.0.0","codename":"Open Universe","date":"2026-06-21","summary":"The galaxy opens to every scientist in the sky.","changes":["Explore anyone: search a researcher by name and the whole galaxy re-forms around their life's work, charted live from OpenAlex.","Share this Cosmograph: capture your current view as a stat-laden card and copy it straight to the clipboard \u2014 no downloads, no detours.","Bridge refit: Replay and Tour moved up beside Orbit and Fly, while Share and the GitHub beacon dropped into the command bar.","A new footer beacon spells out what Cosmograph is for every first-time arrival."]},{"version":"1.3.0","codename":"Bridge Console","date":"2026-06-20","summary":"Hauled the helm up to the bridge and opened the ship's log.","changes":["Orbit and Fly thrusters relocated to the top deck, docked right beside the Info port.","The Info beacon flies its name again \u2014 no more guessing at the lone glyph.","Cracked open this flight log so you can trace every jump the ship has made."]},{"version":"1.2.0","codename":"Star Charts","date":"2026-06-20","summary":"Drew up the navigation charts for every pilot aboard.","changes":["Added a navigation primer for Orbit and Fly modes inside the Info port.","Retired the manual tilt lever \u2014 a right-drag now banks the whole sky for you."]},{"v // A deep 3D shell (plus nearer dust), so the sky never runs out when you zoom out.
function starLayer(n, rMin, rMax, size, opacity, seed) {
  const r = rand(seed), pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
  const tints = [[1, 1, 1], [0.8, 0.85, 1], [1, 0.92, 0.8], [0.85, 0.8, 1]];
  for (let i = 0; i < n; i++) {
    const u = r() * 2 - 1, th = r() * Math.PI * 2, s = Math.sqrt(1 - u * u), R = rMin + Math.pow(r(), 0.6) * (rMax - rMin);
    pos.set([Math.cos(th) * s * R, u * R, Math.sin(th) * s * R], i * 3);
    const t = tints[Math.floor(r() * tints.length)], b = 0.55 + r() * 0.45;
    col.set([t[0] * b, t[1] * b, t[2] * b], i * 3);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ size, sizeAttenuation: false, vertexColors: true, transparent: true, opacity, depthWrite: false, fog: false }));
  pts.frustumCulled = false; scene.add(pts); return pts;
}

function shell(n) {
  if (shellCache.has(n)) return shellCache.get(n);
  const h = (n - 1) / 2, out = [];
  for (let x = -h; x <= h; x++) for (let y = -h; y <= h; y++) for (let z = -h; z <= h; z++)
    if (Math.abs(x) === h || Math.abs(y) === h || Math.abs(z) === h) out.push([x, y, z]);

}

// Surface patterns: returns 0 base, 1 dark, 2 light, 3 accent.
function voxelTone(pattern, ix, iy, iz, n, seed, r) {
  if (n === 1) return 0;
  switch (pattern) {
    case "bands": return Math.floor(iy * 4 / n) % 2 ? 1 : (iy === n - 1 ? 2 : 0);
    case "caps": return iy === 0 || iy === n - 1 ? 2 : (r() < 0.12 ? 1 : 0);
    case "craters": return r() < 0.14 ? 1 : (r() < 0.06 ? 2 : 0);
    case "stripes": return (ix + iz + seed) % 3 === 0 ? 1 : 0;
    case "speckle": return r() < 0.28 ? 2 : 0;
    case "equator": return iy === Math.floor(n / 2) ? 3 : (iy > n / 2 ? 2 : 0);
    case "checker": return (ix + iy + iz) % 2 ? 1 : 0;
    default: { // continents
      const s = Math.sin(ix * 1.3 + seed) + Math.cos(iz * 1.1 + seed * 2) + Math.sin(iy * 0.9 + seed * 3);
      return s > 0.8 ? 1 : s < -1.3 ? 2 : 0;
    }
  }
}

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const clock = new THREE.Clock();
function frame(now) {
  const t = reduce ? 0 : clock.getElapsedTime();
  stepCam(now);
  controls.update();
  { // Aerial perspective: things behind the focus point fade toward the background.
    const dd = camera.position.distanceTo(controls.target), R = activeSi === null ? galaxyRadius : Math.max(galaxyRadius * 0.5, systems[activeSi].extent * 3);
    scene.fog.near = Math.max(1, dd - R * 0.45); scene.fog.far = dd + R * 0.75; }
  animate(t);
  camera.updateMatrixWorld();
  placeTags();
  renderer.clear();
  const warp = jump ? jumpFrame(now) : 0;
  { const dd = camera.position.distanceTo(controls.target); bloom.strength = THREE.MathUtils.clamp(dd / 2500, 0.25, 0.9); }
  if (warp < 0.98) composer.render();
  if (jump) { renderer.clearDepth(); renderer.render(jumpScene, jumpCam); }
  requestAnimationFrame(frame);
}
// Open on the whole galaxy, from a raised three-quarter angle.
flyTo(galaxyCenter, galaxyRadius, new THREE.Vector3(0.62, 0.62, 0.48).normalize());
requestAnimationFrame(frame);
window.__fog = () => ({ near: Math.round(scene.fog.near), far: Math.round(scene.fog.far), d: systems.map((S) => Math.round(camera.position.distanceTo(S.g.position))) }); window.__ys = systems.map((S) => Math.round(S.g.position.y)); window.__debug = { systems: systems.map((S) => ({ name: DATA.domains[S.si].name, extent: Math.round(S.extent), lanes: new Set(S.planets.map((p) => p.lane)).size, sizes: [...new Set(S.planets.map((p) => p.n))].sort((a, b) => a - b).join(",") })), galaxyRadius: Math.round(galaxyRadius) };
