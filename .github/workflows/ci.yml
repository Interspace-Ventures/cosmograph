name: CI

on:
  pull_request:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Install, typecheck, test, build, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.9.0

      - name: Set up Node.js (pinned in .node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: |
          pnpm -r --if-present run test
          pnpm --filter @workspace/release-flags exec tsx --test src/index.test.ts
          pnpm run test:deploy

      # Builds what ships (web + API), same as managed-standards. The legacy
      # artifacts/trailer vite config needs PORT/BASE_PATH and is not deployed.
      - name: Build
        run: pnpm deploy:build

      - name: Audit (fail on high or critical)
        run: pnpm audit --audit-level=high
